[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# The legacy ad-hoc scripts in the repository root are excluded from collection
# (see the root conftest.py) so that no pytest invocation can write to the
# shared Supabase project.
norecursedirs = .venv .git __pycache__ .pytest_cache build dist

markers =
    integration: read-only tests that talk to the configured Supabase project
    dbwrite: tests that write to the database; opt-in only, never run by default

filterwarnings =
    ignore::DeprecationWarning
