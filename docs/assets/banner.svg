<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Procura-AI: multi-agent procurement with provenance-aware memory">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#101a33"/>
      <stop offset="1" stop-color="#0d2a2a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc">
        <animate attributeName="stop-color" values="#7dd3fc;#a78bfa;#5eead4;#7dd3fc" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#5eead4">
        <animate attributeName="stop-color" values="#5eead4;#7dd3fc;#a78bfa;#5eead4" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>

  <!-- drifting glow -->
  <circle r="180" fill="url(#glow)">
    <animate attributeName="cx" values="180;1020;180" dur="18s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="80;250;80" dur="14s" repeatCount="indefinite"/>
  </circle>

  <!-- agent network (right) -->
  <g transform="translate(820 60)" fill="none" stroke-linecap="round">
    <path d="M60 100 L190 40 L320 100 L190 180 Z" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 8">
      <animate attributeName="stroke-dashoffset" values="0;-56" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M190 40 L190 180" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 8">
      <animate attributeName="stroke-dashoffset" values="0;56" dur="3s" repeatCount="indefinite"/>
    </path>
    <g stroke="none">
      <circle cx="60" cy="100" r="9" fill="#38bdf8"><animate attributeName="r" values="9;13;9" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="190" cy="40" r="9" fill="#a78bfa"><animate attributeName="r" values="9;13;9" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="320" cy="100" r="9" fill="#5eead4"><animate attributeName="r" values="9;13;9" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="190" cy="180" r="7" fill="#f59e0b"><animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/></circle>
      <circle r="4" fill="#fff">
        <animateMotion dur="5s" repeatCount="indefinite" path="M60 100 L190 40 L320 100 L190 180 Z"/>
      </circle>
    </g>
    <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#cbd5e1">
      <text x="22" y="132">Vendra</text>
      <text x="162" y="22">Procura</text>
      <text x="300" y="132">Finora</text>
      <text x="152" y="208">memory</text>
    </g>
  </g>

  <!-- text -->
  <g font-family="Inter,'Segoe UI',system-ui,sans-serif">
    <text x="64" y="128" font-size="72" font-weight="800" fill="url(#title)" letter-spacing="-2">Procura-AI</text>
    <text x="66" y="172" font-size="22" fill="#e2e8f0">Multi-agent procurement with provenance-aware memory</text>
    <text x="66" y="206" font-size="15" fill="#94a3b8" font-family="ui-monospace,Menlo,Consolas,monospace">LangGraph  ·  FastAPI  ·  Supabase + pgvector  ·  NVIDIA Nemotron  ·  ERPNext (MCP)  ·  Langfuse</text>
    <g transform="translate(66 236)" font-size="13" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#0b1220">
      <rect width="148" height="30" rx="15" fill="#7dd3fc"/><text x="18" y="20" font-weight="700">3 agents</text>
      <rect x="160" width="170" height="30" rx="15" fill="#a78bfa"/><text x="178" y="20" font-weight="700">18 sub-agents</text>
      <rect x="342" width="196" height="30" rx="15" fill="#5eead4"/><text x="360" y="20" font-weight="700">full provenance</text>
    </g>
  </g>
</svg>
