<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Request flows from the router through the coordinator to Vendra, Procura and Finora, with every step written to memory">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#0f1b2d"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="1200" height="380" rx="18" fill="url(#bg)"/>

  <g font-family="Inter,'Segoe UI',system-ui,sans-serif" text-anchor="middle">
    <!-- router -->
    <g transform="translate(40 130)">
      <rect width="170" height="84" rx="12" fill="#13223b" stroke="#334155"/>
      <text x="85" y="36" fill="#e2e8f0" font-size="17" font-weight="700">Router</text>
      <text x="85" y="58" fill="#94a3b8" font-size="12">rules first, LLM second</text>
    </g>
    <!-- orchestrator -->
    <g transform="translate(260 130)">
      <rect width="190" height="84" rx="12" fill="#13223b" stroke="#334155"/>
      <text x="95" y="36" fill="#e2e8f0" font-size="17" font-weight="700">Task Orchestrator</text>
      <text x="95" y="58" fill="#94a3b8" font-size="12">parse, persist, resume</text>
    </g>
    <!-- agents -->
    <g transform="translate(520 60)">
      <rect width="190" height="84" rx="12" fill="#0c2a3d" stroke="#38bdf8"/>
      <text x="95" y="36" fill="#7dd3fc" font-size="18" font-weight="800">VENDRA</text>
      <text x="95" y="58" fill="#94a3b8" font-size="12">eligibility · compliance</text>
    </g>
    <g transform="translate(520 148)">
      <rect width="190" height="84" rx="12" fill="#241a3f" stroke="#a78bfa"/>
      <text x="95" y="36" fill="#c4b5fd" font-size="18" font-weight="800">PROCURA</text>
      <text x="95" y="58" fill="#94a3b8" font-size="12">RFQ · quotes · PO</text>
    </g>
    <g transform="translate(520 236)">
      <rect width="190" height="84" rx="12" fill="#0b2e2b" stroke="#5eead4"/>
      <text x="95" y="36" fill="#5eead4" font-size="18" font-weight="800">FINORA</text>
      <text x="95" y="58" fill="#94a3b8" font-size="12">budget · approval routing</text>
    </g>
    <!-- gate -->
    <g transform="translate(790 148)">
      <rect width="170" height="84" rx="12" fill="#2a1f0b" stroke="#f59e0b"/>
      <text x="85" y="36" fill="#fbbf24" font-size="17" font-weight="700">Approval gate</text>
      <text x="85" y="58" fill="#94a3b8" font-size="12">a person decides</text>
    </g>
    <!-- outputs -->
    <g transform="translate(1010 100)">
      <rect width="150" height="64" rx="12" fill="#13223b" stroke="#334155"/>
      <text x="75" y="30" fill="#e2e8f0" font-size="15" font-weight="700">ERPNext PO</text>
      <text x="75" y="48" fill="#94a3b8" font-size="12">via MCP</text>
    </g>
    <g transform="translate(1010 196)">
      <rect width="150" height="64" rx="12" fill="#13223b" stroke="#334155"/>
      <text x="75" y="30" fill="#e2e8f0" font-size="15" font-weight="700">Vendor email</text>
      <text x="75" y="48" fill="#94a3b8" font-size="12">PDF, sent on click</text>
    </g>
    <!-- memory -->
    <g transform="translate(40 336)">
      <rect width="1120" height="34" rx="10" fill="#0f2a1f" stroke="#22c55e" stroke-opacity="0.6"/>
      <text x="560" y="22" fill="#86efac" font-size="13" font-family="ui-monospace,Menlo,Consolas,monospace">Supabase · agent_memories + memory_provenance · versioned, sourced, shareable, searchable</text>
    </g>
  </g>

  <!-- flow lines -->
  <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="7 7">
    <path d="M210 172 H258"><animate attributeName="stroke-dashoffset" values="0;-28" dur="1.6s" repeatCount="indefinite"/></path>
    <path d="M450 172 C485 172 485 102 518 102"><animate attributeName="stroke-dashoffset" values="0;-28" dur="1.6s" repeatCount="indefinite"/></path>
    <path d="M615 144 V146" stroke-dasharray="0"/>
    <path d="M710 102 C750 102 750 172 788 172"><animate attributeName="stroke-dashoffset" values="0;-28" dur="1.6s" repeatCount="indefinite"/></path>
    <path d="M960 172 C985 172 985 132 1008 132"><animate attributeName="stroke-dashoffset" values="0;-28" dur="1.6s" repeatCount="indefinite"/></path>
    <path d="M960 190 C985 190 985 228 1008 228"><animate attributeName="stroke-dashoffset" values="0;-28" dur="1.6s" repeatCount="indefinite"/></path>
  </g>
  <!-- hand-offs between agents -->
  <g fill="none" stroke-width="2" stroke-dasharray="5 6">
    <path d="M600 144 V148" stroke="#38bdf8"/>
    <path d="M600 232 V236" stroke="#a78bfa"/>
  </g>
  <!-- memory writes -->
  <g stroke="#22c55e" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="3 6" fill="none">
    <path d="M615 144 V336"><animate attributeName="stroke-dashoffset" values="0;18" dur="1.4s" repeatCount="indefinite"/></path>
    <path d="M355 214 V336"><animate attributeName="stroke-dashoffset" values="0;18" dur="1.4s" repeatCount="indefinite"/></path>
  </g>

  <!-- traveling request -->
  <g>
    <circle r="9" fill="#38bdf8" opacity="0.35" filter="url(#soft)">
      <animateMotion dur="7s" repeatCount="indefinite" path="M40 172 H258 C300 172 330 172 358 172 H450 C485 172 485 102 518 102 L610 102 V190 L610 278 L720 278 C760 278 760 172 788 172 H960 C985 172 985 132 1008 132"/>
    </circle>
    <circle r="5" fill="#fff">
      <animateMotion dur="7s" repeatCount="indefinite" path="M40 172 H258 C300 172 330 172 358 172 H450 C485 172 485 102 518 102 L610 102 V190 L610 278 L720 278 C760 278 760 172 788 172 H960 C985 172 985 132 1008 132"/>
    </circle>
  </g>
</svg>
